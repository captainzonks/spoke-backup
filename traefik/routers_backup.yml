# ==============================================================================
# BACKUP MODULE - TRAEFIK ROUTERS
# ==============================================================================
# Description: HTTP routing rules for the Kopia backup web UI
# Author: Matt Barham
# Created: 2026-04-28
# Modified: 2026-11-26
# Version: 2.0.0
# Host: Your Server
# ==============================================================================
# Type: Traefik Dynamic Config (routers)
# Component: module: backup
# Deployed by Spoke as: mod_backup_routers_backup.yml
# Dependencies:
#   - mod_backup_services_backup.yml (service definitions)
#   - hub v1.3.0 or later (chain-authentik-keep-authorization): Authentik
#     forward auth first, then Kopia's own basic auth
#   - an Authentik proxy provider for this host (see README)
#   - Environment variables: DOMAIN, KOPIA_SUBDOMAIN
# ==============================================================================

http:
  routers:
    #======================================================
    #====================== KOPIA UI =====================
    #======================================================

    kopia:
      rule: Host(`${KOPIA_SUBDOMAIN}.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      priority: 100
      middlewares: chain-authentik-keep-authorization@file
      service: kopia-svc@file
      tls: {}
